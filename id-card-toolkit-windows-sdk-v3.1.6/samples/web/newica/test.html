        function setHeight() {

            document.getElementById("body").style.height = ((heights / 100) * 90) + 5 + "px";

        window.onresize = function () {
            setHeight();
        };

    <div id="result" class="dis"></div>
    <script>
        var elems = document.getElementById("sideList").getElementsByTagName("li");
        makeActive = function () {
            for (var i = 0; i < elems.length; i++)
                elems[i].classList.remove('active');
            this.classList.add('active');
        };
        for (var i = 0; i < elems.length; i++)
            elems[i].addEventListener('click', makeActive);

    </script>
