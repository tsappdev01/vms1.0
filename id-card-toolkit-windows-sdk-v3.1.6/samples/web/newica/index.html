    <script>
        var elems = document.getElementById("sideList").getElementsByTagName("li");
        makeActive = function () {
            for (var i = 0; i < elems.length; i++)
                elems[i].classList.remove('active');
            this.classList.add('active');
        };
        for (var i = 0; i < elems.length; i++)
            elems[i].addEventListener('click', makeActive);
            
            document.getElementById('submit').addEventListener('click', function() {

            var idnum = document.getElementById('id_number').value;
            var isChecked = document.getElementById('digitaldocs').checked;
            var checkboxState = isChecked ? true : false;
            facevalues(idnum, checkboxState);

            });

            document.getElementById('submitpassport').addEventListener('click', function() {

            var passnum = document.getElementById('passportnumber').value;
            var issuecty = document.getElementById('issuecountry').value;
            var expdate = document.getElementById('expirydate').value;
            var dateofbirth = document.getElementById('dob').value;
            var isChecked = document.getElementById('passportdigital').checked;
            var checkboxState = isChecked ? true : false;
            passportvalues(passnum,issuecty,expdate,dateofbirth, checkboxState);

            });

    </script>
