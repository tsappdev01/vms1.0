org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Where ICP's SDK sits, relative to this build. The shim modules read it, so the binaries
# are referenced from one place instead of copied into three.
SDK=../id-card-toolkit-android-sdk-v3.1.6/id-card-toolkit-android-sdk-v3.1.6

# The VMS server. Overridable on the command line (-PVMS_API_BASE_URL=...) for a test
# host. The trailing slash matters to Retrofit.
VMS_API_BASE_URL=https://vms.dipark.com/

# The signing certificate's hash, URL-encoded, for the MSAL redirect URI. It is a property
# of the keystore, not of the source, so the debug and release builds have different ones -
# see android/README.md. Set it here for a local debug build, or pass
# -PMSAL_SIGNATURE_HASH=... when building the release.
#MSAL_SIGNATURE_HASH=

# Entra ID sign-in. Must match the server's Authentication:Enabled, which is currently
# false. Turn both on together: -PVMS_AUTH_ENABLED=true, and res/raw/auth_config.json has
# to exist for that build.
VMS_AUTH_ENABLED=false

