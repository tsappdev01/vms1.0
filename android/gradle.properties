org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Where ICP's SDK sits, relative to this build. The shim modules read it, so the binaries
# are referenced from one place instead of copied into three.
SDK=../id-card-toolkit-android-sdk-v3.1.6/id-card-toolkit-android-sdk-v3.1.6

# The VMS server a build is pointed at by default. The tablet can be moved to another
# one from the settings screen without a rebuild, so this only decides where a fresh
# install looks first. Overridable on the command line (-PVMS_API_BASE_URL=...). The
# trailing slash matters to Retrofit.
VMS_API_BASE_URL=https://vms-cebrd3evb0cyg0gn.uaenorth-01.azurewebsites.net/

# Parallel configuration during IDE sync.
org.gradle.tooling.parallel=true

# The API key for the Azure-hosted API. Deliberately not set here - it is a credential,
# and this file is in git. Pass -PVMS_API_KEY=... or put it in
# %USERPROFILE%\.gradle\gradle.properties, which is per machine and outside the repository.
# Like the address it is only a default: a rotated key can be typed into the settings
# screen. Blank is right for builds aimed at the on-premises host, which asks for none.
#VMS_API_KEY=
