plugins {
    id 'com.android.application'
    id 'kotlin-android'

    id 'kotlin-android-extensions'

    //kotlin kapt and navigatio`n safeargs plugin
    id 'kotlin-kapt'

    id "androidx.navigation.safeargs"
    id 'org.jetbrains.kotlin.android'
    id 'org.jlleitschuh.gradle.ktlint'
}

android {
    namespace 'ae.emiratesid.idcard.toolkit.sample'
    compileSdk 35

    defaultConfig {
        applicationId "ae.emiratesid.idcard.toolkit.sample"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "3.1.6"
        multiDexEnabled true
    }
    signingConfigs {
        release {
            keyAlias 'key0'
            keyPassword '123456'
            storeFile file('D:\\Toolkit\\2.0.6-r1\\PayskyKeyStore\\payskykey.jks')
            storePassword '123456'
            //Enable V1 signing
            v1SigningEnabled true
            v2SigningEnabled false
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    splits {

        // Configures multiple APKs based on ABI.
        abi {

            // Enables building multiple APKs per ABI.
            enable true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for x86, armeabi-v7a, and mips.

            // Resets the list of ABIs that Gradle should create APKs for to none.
            reset()

            // arm64-v8a : modern 64-bit ARM devices (Android 5.0+)
            // armeabi-v7a : older 32-bit ARM devices
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    packagingOptions {
        exclude 'AndroidManifest.xml'
        // Multiple SDK AARs bundle libc++_shared.so at different NDK versions.
        // pickFirst keeps whichever merges FIRST, not the newest. Tech5's
        // libopencv_world.so needs a newer libc++ that exports the
        // std::__ndk1::basic_stringstream VTT symbol; if an older copy wins the
        // merge, OpenCV fails to dlopen at runtime (UnsatisfiedLinkError). The
        // app source set is merged first, so we pin Tech5's (newest) copy in
        // app/src/main/jniLibs/<abi>/libc++_shared.so to win pickFirst. libc++
        // is a backward-compatible superset, so the newest satisfies every
        // consumer. (Not in tng_file_hash.c, so pinning it does not trip
        // tng_validate_plugin_integrity.)
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        // Do not re-strip .so files — they are already stripped by CMake
        // (source-built plugins) or vendors (pre-built AARs).  Re-stripping
        // changes the SHA256, causing tng_validate_plugin_integrity() to
        // reject every plugin as tampered.
        doNotStrip "**/*.so"
        jniLibs {
            // Required for plugin .so extraction — toolkitcore uses dlopen()
            // to discover and load plugin libraries at runtime.
            useLegacyPackaging = true
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

