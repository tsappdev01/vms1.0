name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DI.Vms.sln

      - name: Build
        run: dotnet build DI.Vms.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DI.Vms.sln --configuration Release --no-build --verbosity normal
