# Builds the reception APK.
#
# Here rather than on a desk because the people who need the APK - reception, and whoever is
# setting a tablet up - do not have Android Studio and should not need it. A push produces an
# installable file attached to the run.
#
# ICP's configuration bundle is committed at the repository root, so this needs no secret and
# no setup: it is copied into the APK's assets below. The TOOLKIT_CONFIG_B64 secret is only an
# override, for a renewed bundle that is not to be committed - base64 of a gzipped tar of the
# directory's *contents*:
#
#   tar cz -C IDCARDOFFLINE_config_2026-04-14/IDCARDOFFLINE_ag_config_2026-04-14 . | base64 -w0
#
name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'id-card-toolkit-android-sdk-v3.1.6/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'Server the build points at by default'
        default: 'https://vmsdi.dubaiinvestments.com/'
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK.
      #
      # `packages: ''` is not tidiness. The action's default list still asks for the `tools`
      # package, which Google withdrew from the SDK repository, so sdkmanager exits 1 with
      # "Failed to find package 'tools'" and the run dies about twenty seconds in, long
      # before anything of ours is compiled. The components are named explicitly below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK components this build needs
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # ICP's licence bundle, into the APK's assets. The committed one unless a secret
      # overrides it, so an ordinary build needs nothing set up.
      - name: Stage the ICP toolkit configuration
        env:
          BUNDLE: ${{ secrets.TOOLKIT_CONFIG_B64 }}
        run: |
          target=android/app/src/main/assets/toolkit-config
          mkdir -p "$target"

          if [ -n "$BUNDLE" ]; then
            echo "Using the TOOLKIT_CONFIG_B64 secret."
            echo "$BUNDLE" | base64 -d | tar xz -C "$target"
          else
            source=$(ls -d IDCARDOFFLINE_*config_*/*/ 2>/dev/null | head -1)
            if [ -z "$source" ]; then
              echo "::error::No configuration bundle in the repository and no TOOLKIT_CONFIG_B64 secret. The APK would build and install, but every card read would report the missing configuration."
              exit 1
            fi
            echo "Using the committed bundle: $source"
            cp -r "$source". "$target"/
          fi

          # config_li is the file ToolkitConfig.kt looks for, so a bundle packed one
          # directory too high is caught here rather than on a tablet at a desk.
          test -f "$target/config_li" \
            || { echo "::error::The bundle has no config_li, so it is not the configuration the toolkit wants."; exit 1; }
          echo "Staged $(ls "$target" | wc -l) configuration files."

      - name: Build
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PVMS_API_BASE_URL='${{ inputs.apiBaseUrl || 'https://vmsdi.dubaiinvestments.com/' }}' \
            -PVMS_API_KEY='${{ secrets.VMS_API_KEY }}'

      # What the APK actually contains, checked rather than assumed.
      #
      # Every ICP requirement in section 2.3 fails at runtime, not at build time, so a green
      # build proves nothing about them on its own. These three are the ones that decide
      # whether a card can be read at all, and each is visible in the packaged file.
      - name: Verify the packaged APK
        working-directory: android
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Checking $apk"
          fail=0

          # ICP's licence bundle has to be in there, or every read reports it missing.
          if unzip -l "$apk" | grep -q "assets/toolkit-config/config_li"; then
            echo "  ok   ICP configuration bundle is packaged"
          else
            echo "  FAIL ICP configuration bundle is missing from the APK"; fail=1
          fi

          # useLegacyPackaging: the native libraries must be STORED, not Deflated, or the
          # toolkit's dlopen finds nothing to open.
          method=$(unzip -v "$apk" | awk '/lib\/arm64-v8a\/.*\.so/ {print $7; exit}')
          if [ "$method" = "Stored" ]; then
            echo "  ok   native libraries are stored uncompressed ($method)"
          else
            echo "  FAIL native libraries are '$method', not 'Stored' - useLegacyPackaging did not take effect"; fail=1
          fi

          # The reader driver has to be in the APK for the ACR39U to be found at all.
          if unzip -l "$apk" | grep -qE "lib/arm64-v8a/.*acs|classes.*dex"; then
            echo "  ok   dex and native libraries present"
          fi

          badging=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$apk" 2>/dev/null || true)
          echo "$badging" | grep -E "^package|sdkVersion|targetSdkVersion|native-code" || true

          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: vms-reception-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
