name: Server

# DI-IT-POL-AIDEV-001 §7: every merge runs build verification and a dependency audit.
# Until this existed nothing built the server in CI at all - only the Android APK - so a
# change that did not compile could be pushed and only discovered on a deployment.

on:
  push:
    paths:
      - 'src/**'
      - 'db/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # -r linux-x64 and VmsAgentOnly: the portable build, which is what the Linux Web App
      # runs. The Windows target needs the ICP toolkit and cannot build on this runner.
      - name: Restore
        run: |
          dotnet restore src/DI.Vms.Blazor/DI.Vms.Blazor.csproj -p:VmsAgentOnly=true
          dotnet restore src/DI.Vms.Api/DI.Vms.Api.csproj

      - name: Build the web app
        run: dotnet build src/DI.Vms.Blazor/DI.Vms.Blazor.csproj -c Release -p:VmsAgentOnly=true --no-restore

      - name: Build the standalone API
        run: dotnet build src/DI.Vms.Api/DI.Vms.Api.csproj -c Release --no-restore

      # The NuGet audit the policy asks for. Reported rather than enforced to begin with:
      # a transitive advisory published overnight should not stop a reception desk being
      # fixed, and a failure nobody can act on immediately teaches people to ignore the job.
      - name: Dependency vulnerability audit
        continue-on-error: true
        run: |
          echo "## Vulnerable packages" >> "$GITHUB_STEP_SUMMARY"
          dotnet list src/DI.Vms.Blazor/DI.Vms.Blazor.csproj package --vulnerable --include-transitive \
            | tee -a "$GITHUB_STEP_SUMMARY"
          dotnet list src/DI.Vms.Api/DI.Vms.Api.csproj package --vulnerable --include-transitive \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Deprecated packages are not a vulnerability, but they are how a project arrives at
      # one, and the policy's annual review is the wrong place to find out.
      - name: Deprecated package report
        continue-on-error: true
        run: dotnet list src/DI.Vms.Blazor/DI.Vms.Blazor.csproj package --deprecated --include-transitive

      # Secrets must never be committed (§7). This is the backstop that says so out loud:
      # the SQL password in this repository's history is exactly what it is looking for.
      - name: Scan the working tree for secrets
        continue-on-error: true
        run: |
          # The matches are collected before they are judged, deliberately. Testing a
          # pipeline that ends in `tee` tests tee's exit status, which is always success -
          # so the first version of this step warned on every run whether it had found
          # anything or not, which is how a check teaches people to ignore it.
          # `|| true` because grep exits 1 on no match and the shell runs with -e.
          hits=$(grep -rInE "(Password|Pwd)\s*=\s*[^;\"'[:space:]]{6,}|AccountKey=|ClientSecret\"\s*:\s*\"[^\"]{10,}" \
                   --include='*.json' --include='*.cs' --include='*.razor' --include='*.ps1' \
                   --exclude-dir=bin --exclude-dir=obj src/ deploy/ db/ 2>/dev/null \
                 | grep -vE "\"(Password|ClientSecret)\"\s*:\s*\"\"|<value>|template|example" || true)

          echo "## Possible secrets in tracked files" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::Something that looks like a credential is in a tracked file."
          else
            echo "None found in the working tree." >> "$GITHUB_STEP_SUMMARY"
            echo "No credentials found in tracked files."
          fi

  # The installable build, attached to the run.
  #
  # Here for the same reason the APK is built in CI: the people who need it - whoever is
  # deploying to the Azure Web App, to UATWEB01, or to a reception PC - should not need a
  # .NET SDK and a checkout to get one. A push produces a zip on the run page.
  #
  # windows-latest, not ubuntu. The reception build is net8.0-windows because it references
  # ICP's IDCardToolkit.dll, a .NET Framework assembly that P/Invokes native Windows DLLs,
  # and the Web App in use is a Windows plan. The build job above still runs on ubuntu with
  # -p:VmsAgentOnly=true, which is the cheaper check that the shared code compiles; this one
  # is the artefact.
  publish:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      #  A version that says which build this is.
      #
      #  Nothing sets <Version> in the csproj, so every build this project has produced
      #  reports v1.0.0 - the SDK's default - including the one that crash-looped on
      #  2 October. "Which version am I running?" was therefore unanswerable from the
      #  screen, and the only discriminator was the DLL's file time, which a zip deploy
      #  rewrites to the extraction time.
      #
      #  1.0.<run>-<commit> fixes that: the run number is monotonic, the short SHA names
      #  the exact source, and BuildInfo.Describe already renders it as "v1.0.9-c26ad7c".
      - name: Work out a version that names the commit
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "1.0.${{ github.run_number }}-$sha"
          "VMS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "This build reports v$version"

      # The same arguments deploy/publish-azure.ps1 uses, so what comes out of CI is what
      # comes off a build machine. Framework-dependent: App Service and UATWEB01 both have
      # the runtime, and self-contained would quadruple the download for nothing.
      - name: Publish the reception build
        shell: pwsh
        run: >
          dotnet publish src/DI.Vms.Blazor/DI.Vms.Blazor.csproj
          -c Release -r win-x64 --self-contained false
          -p:InformationalVersion=$env:VMS_VERSION
          -o publish/reception

      # The portable build, for a Linux Web App or an API-only host. Same application with
      # ICP's toolkit left out - every screen, the report and /api are all there; the only
      # thing it cannot do is read a card with a reader plugged into the server, which is a
      # thing no server does. Toolkit__Mode=Agent is required on it.
      - name: Publish the portable build
        shell: pwsh
        run: >
          dotnet publish src/DI.Vms.Blazor/DI.Vms.Blazor.csproj
          -c Release -p:VmsAgentOnly=true
          -p:InformationalVersion=$env:VMS_VERSION
          -o publish/portable

      #  Neither settings file ships, and this is the step that makes sure of it.
      #
      #  `dotnet publish` copies every appsettings.*.json it finds, so both arrive in the
      #  output without anyone asking. appsettings.Production.json would put a connection
      #  string into a zip that gets emailed around, and would silently win over the Web
      #  App's own configuration. appsettings.Development.json is not a secret - it holds a
      #  developer's local toolkit paths - but it describes somebody's machine, and its
      #  DetailedErrors would turn on if ASPNETCORE_ENVIRONMENT were ever Development on
      #  that host.
      #
      #  It fails the job rather than warning. A deleted file is only safe if the delete
      #  happened, and a warning on a publish step is a warning nobody reads before
      #  downloading the zip.
      - name: Keep the settings files out of the package
        shell: pwsh
        run: |
          foreach ($dir in 'publish/reception', 'publish/portable') {
            foreach ($name in 'appsettings.Production.json', 'appsettings.Development.json') {
              $path = Join-Path $dir $name
              if (Test-Path $path) {
                Remove-Item $path -Force
                Write-Host "Removed $path"
              }
            }
          }

          $left = Get-ChildItem publish -Recurse -Include 'appsettings.Production.json', 'appsettings.Development.json'
          if ($left) {
            $left | ForEach-Object { Write-Host "::error::$($_.FullName) is still in the package." }
            exit 1
          }
          Write-Host 'Neither settings file is in either package.'

      # The native toolkit DLLs are what the reception build exists for, and they are
      # copied by a CopyToPublishDirectory in the csproj rather than by the build itself -
      # which means a refactor can drop them and the publish still succeeds. The app would
      # then start and fail on the first read with 0x8007007E, naming the assembly it could
      # not load rather than the dependency that was actually missing.
      #  Startup logging on, in the package rather than in the portal.
      #
      #  deploy/publish-azure.ps1 does this and the first version of this job did not, so
      #  what CI produced was not what the script produces - which is the whole claim the
      #  job is making. A .NET app that throws before the host starts does not serve a page
      #  saying so: App Service answers 503 or 500.30, and the reason is only in the event
      #  log or in stdout. stdout is off by default, and turning it on afterwards means
      #  editing web.config on a site that is already down, through Kudu, on a machine
      #  nobody wants to be learning about at that moment.
      #
      #  Every reason this app refuses to start is deliberate and has a written message -
      #  no connection string, a column missing from the database, no API key on a public
      #  host - and every one of them lands in that file.
      - name: Turn on startup logging in the package
        shell: pwsh
        run: |
          $webConfig = 'publish/reception/web.config'
          if (-not (Test-Path $webConfig)) {
            Write-Host "::error::web.config is not in the published output."
            exit 1
          }

          $xml = [xml](Get-Content $webConfig)
          $handler = $xml.SelectSingleNode('//aspNetCore')
          if (-not $handler) {
            Write-Host "::error::web.config has no aspNetCore element - the publish did not produce the expected file."
            exit 1
          }

          $handler.SetAttribute('stdoutLogEnabled', 'true')
          $handler.SetAttribute('stdoutLogFile', '.\\logs\\stdout')
          $xml.Save((Resolve-Path $webConfig))
          Write-Host 'stdout logging is on in the reception package.'

      - name: Check the reception build carries the toolkit
        shell: pwsh
        run: |
          $missing = @()
          foreach ($dll in 'IDCardToolkit.dll', 'EIDAToolkit.dll', 'PCSCLib.dll') {
            if (Test-Path "publish/reception/$dll") {
              Write-Host "  ok   $dll"
            } else {
              Write-Host "::error::publish/reception/$dll is missing - card reading would fail at runtime."
              $missing += $dll
            }
          }
          if ($missing) { exit 1 }

          foreach ($required in 'DI.Vms.Blazor.dll', 'web.config', 'appsettings.json') {
            if (Test-Path "publish/reception/$required") {
              Write-Host "  ok   $required"
            } else {
              Write-Host "::error::publish/reception/$required is not in the published output."
              $missing += $required
            }
          }
          if ($missing) { exit 1 }

          $count = (Get-ChildItem publish/reception -Filter *.dll).Count
          Write-Host "Reception build: $count DLLs."

      #  Named for WHERE EACH GOES, not for what each is.
      #
      #  They were called vms-web-reception-win-x64 and vms-web-portable, which describes
      #  the build and leaves the reader to work out the destination. On 2 October the
      #  win-x64 one went to the Linux Web App and crash-looped - see K-27. A name that
      #  answers "which do I deploy?" costs nothing and is read by whoever is deploying at
      #  the time, which a comment in a document is not.
      - uses: actions/upload-artifact@v4
        with:
          name: vms-web-FOR-WINDOWS-HOST-uatweb01-or-reception-pc
          path: publish/reception/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vms-web-FOR-LINUX-HOST-azure-web-app
          path: publish/portable/**
          if-no-files-found: error
